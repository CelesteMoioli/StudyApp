<ion-header>
  <ion-toolbar>
    <ion-title>Elegí tu avatar</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="avatar-grid">
    <div
      class="avatar-option"
      *ngFor="let avatar of avatares"
      [class.selected]="avatarSeleccionado === avatar"
      (click)="seleccionar(avatar)">
      <img [src]="avatar" alt="Avatar" />
    </div>
  </div>

  <ion-button expand="block" (click)="confirmar()" [disabled]="!avatarSeleccionado">
    Usar este avatar
  </ion-button>
</ion-content>
